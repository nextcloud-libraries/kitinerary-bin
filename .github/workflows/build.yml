name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  static-build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kitinerary repo
        uses: actions/checkout@v4
        with:
          repository: 'KDE/kitinerary'
          fetch-depth: 0
          path: kitinerary
      - name: Checkout last kitinerary version tag
        id: version
        working-directory: kitinerary
        run: |
          # git describe only finds tags that are ancestors of HEAD, but KDE
          # cuts releases on separate release/* branches that never merge
          # back into master, so it misses newer releases. Look at all tags
          # instead, and ignore beta/RC tags (*.80/*.90 patch versions).
          export KITINERARY_VERSION=$(git tag -l 'v*.*.*' | grep -vE '\.(8[0-9]|9[0-9])$' | sort -V | tail -1)
          echo "KITINERARY_VERSION=$KITINERARY_VERSION" >> "$GITHUB_OUTPUT"
          git checkout $KITINERARY_VERSION
      - name: Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/kitinerary:/kitinerary" \
            -v "$GITHUB_WORKSPACE/builds:/builds" \
            -e BUILD_ROOT=/builds \
            -e STAGING_ROOT=/builds/staging \
            -e CI_PROJECT_PATH=pim/kitinerary \
            -w /kitinerary \
            centos:centos7 \
            bash -c '
              set -e
              scripts/setup-centos.sh
              source /opt/rh/rh-git227/enable
              source /opt/rh/devtoolset-11/enable
              scripts/build-openssl.sh
              scripts/build-iso-codes.sh
              scripts/build-static-qt.sh
              scripts/build-cmake-modules.sh
              scripts/collect-data-files.sh
              strip /builds/pim/kitinerary/build/bin/kitinerary-extractor
            '
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: kitinerary-bin
      - name: Copy artifact
        run: cp "$GITHUB_WORKSPACE/builds/pim/kitinerary/build/bin/kitinerary-extractor" kitinerary-bin/bin/kitinerary-extractor
      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          path: kitinerary-bin
          commit-message: "fix(deps): Bump kitinerary-extractor to ${{ steps.version.outputs.KITINERARY_VERSION }}"
          committer: nextcloud-command <nextcloud-command@users.noreply.github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          branch: "fix/update-kitinerary-extractor-${{ steps.version.outputs.KITINERARY_VERSION }}"
          title: "fix(deps): Bump kitinerary-extractor to ${{ steps.version.outputs.KITINERARY_VERSION }}"
          body: |
            Automated static build
